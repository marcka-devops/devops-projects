name: Production CD Pipeline

on:
  push:
    branches:
      - main
    paths:
      - k8-manifests/prod/app-deployment.yaml
      - .github/workflows/prod-cicd.yaml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  promote-image-to-prod:
    name: Pull QA Latest and Retag for Prod
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      QA_IMAGE: marckdocker/nodejs-app:latest
      PROD_IMAGE: marckdocker/nodejs-app:prod-${{ github.sha }}

    steps:
      - name: Validate Docker Hub configuration
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKERHUB_USERNAME" || { echo "::error::Set the DOCKERHUB_USERNAME Actions variable."; exit 1; }
          test -n "$DOCKERHUB_TOKEN" || { echo "::error::Set the DOCKERHUB_TOKEN Actions secret."; exit 1; }

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull QA latest image
        run: docker pull "${QA_IMAGE}"

      - name: Retag image for production
        run: docker tag "${QA_IMAGE}" "${PROD_IMAGE}"

      - name: Push production image
        run: docker push "${PROD_IMAGE}"

  update-prod-manifest:
    name: Update Prod Manifest
    needs: promote-image-to-prod
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Update image tag in prod manifest
        env:
          IMAGE_TAG: prod-${{ github.sha }}
        run: |
          sed -i -E "s|(^[[:space:]]*image:).*|\\1 marckdocker/nodejs-app:${IMAGE_TAG}|" k8-manifests/prod/app-deployment.yaml

      - name: Show updated manifest
        run: cat k8-manifests/prod/app-deployment.yaml

      - name: Commit and push updated prod manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8-manifests/prod/app-deployment.yaml
          if ! git diff --cached --quiet; then
            git commit -m "Update prod image to prod-${GITHUB_SHA}"
            git push origin main
          else
            echo "Production manifest already references this image."
          fi

  deploy-to-k8s:
    name: Deploy to Production Kubernetes
    needs: update-prod-manifest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-1
      EKS_CLUSTER_NAME: my-cluster-1
      K8S_NAMESPACE: prod

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate AWS role configuration
        env:
          AWS_PROD_ROLE_TO_ASSUME: ${{ secrets.AWS_PROD_ROLE_TO_ASSUME }}
        run: |
          test -n "$AWS_PROD_ROLE_TO_ASSUME" || { echo "::error::Set the AWS_PROD_ROLE_TO_ASSUME Actions secret."; exit 1; }

      - name: Configure AWS credentials from GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PROD_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Generate kubeconfig for EKS
        run: aws eks update-kubeconfig --region "${AWS_REGION}" --name "${EKS_CLUSTER_NAME}"

      - name: Verify identity
        run: |
          aws sts get-caller-identity
          kubectl config current-context

      - name: Verify namespace access
        run: |
          kubectl get pods -n "${K8S_NAMESPACE}"
          kubectl get services -n "${K8S_NAMESPACE}"
          kubectl auth can-i get deployments -n "${K8S_NAMESPACE}" | grep -qx yes
          kubectl auth can-i create deployments -n "${K8S_NAMESPACE}" | grep -qx yes
          kubectl auth can-i patch deployments -n "${K8S_NAMESPACE}" | grep -qx yes
          kubectl auth can-i get services -n "${K8S_NAMESPACE}" | grep -qx yes
          kubectl auth can-i create services -n "${K8S_NAMESPACE}" | grep -qx yes
          kubectl auth can-i patch services -n "${K8S_NAMESPACE}" | grep -qx yes
          kubectl auth can-i get ingresses.networking.k8s.io -n "${K8S_NAMESPACE}" | grep -qx yes
          kubectl auth can-i create ingresses.networking.k8s.io -n "${K8S_NAMESPACE}" | grep -qx yes
          kubectl auth can-i patch ingresses.networking.k8s.io -n "${K8S_NAMESPACE}" | grep -qx yes

      - name: Deploy prod manifests
        run: kubectl apply -f k8-manifests/prod/ -n "${K8S_NAMESPACE}"

      - name: Verify rollout
        run: kubectl rollout status deployment/nodejs-app -n "${K8S_NAMESPACE}" --timeout=180s
